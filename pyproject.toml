[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lordcapulet"
version = "0.1.0"
description = "AiiDA plugins for constrained DFT+U calculations"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Alberto Carta", email = "your.email@example.com"},
]
keywords = ["aiida", "dft", "quantum-espresso", "constrained", "magnetism"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "aiida-core>=2.0.0",
    "aiida-quantumespresso>=4.0.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "botorch>=0.16.0",
    "gpytorch>=1.14.0",
    "scipy>=1.13.0",
    "pandas>=2.0.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-datadir>=1.8.0",
    "pytest-regressions>=2.8.0",
    "pytest-anyio>=0.4.0",
    "jaxtyping>=0.3.0",
    "black>=24.0.0",
    "isort>=5.0.0",
    "pgtest~=1.3",
    "aiida-pseudo>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/alberto-carta/aiida-LordCapulet"
Repository = "https://github.com/alberto-carta/aiida-LordCapulet"
Issues = "https://github.com/alberto-carta/aiida-LordCapulet/issues"

[project.entry-points."aiida.calculations"]
"lordcapulet.constrained_pw" = "lordcapulet.calculations.constrained_pw:ConstrainedPWCalculation"

[project.entry-points."aiida.tools.calculations"]
"lordcapulet.constrained_pw" = "aiida_quantumespresso.tools.calculations.pw:PwCalculationTools"

[project.entry-points."aiida.workflows"]
"lordcapulet.afm_scan" = "lordcapulet.workflows.afm_scan:AFMScanWorkChain"
"lordcapulet.constrained_scan" = "lordcapulet.workflows.constrained_scan:ConstrainedScanWorkChain"
"lordcapulet.global_constrained_search" = "lordcapulet.workflows.global_constrained_search:GlobalConstrainedSearchWorkChain"

[tool.setuptools.package-data]
"lordcapulet.workflows.protocols" = ["*.yaml"]

line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "--tb=short -ra"
testpaths = ["tests"]
console_output_style = "count"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
